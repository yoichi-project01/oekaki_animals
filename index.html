  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"><\u002Fellipse>\n      <g class=\"hop\">\n        <!-- feet -->\n        <ellipse cx=\"92\" cy=\"174\" rx=\"9\" ry=\"5\" fill=\"#e8a89a\"><\u002Fellipse>\n        <ellipse cx=\"128\" cy=\"174\" rx=\"9\" ry=\"5\" fill=\"#e8a89a\"><\u002Fellipse>\n        <!-- body / head as one fluffy shape -->\n        <ellipse cx=\"110\" cy=\"128\" rx=\"56\" ry=\"50\" fill=\"#e2c79b\"><\u002Fellipse>\n        <!-- belly -->\n        <ellipse cx=\"110\" cy=\"140\" rx=\"34\" ry=\"30\" fill=\"#fbf8f1\"><\u002Fellipse>\n        <!-- cheeks -->\n        <ellipse cx=\"76\" cy=\"130\" rx=\"14\" ry=\"12\" fill=\"#f3c9c5\"><\u002Fellipse>\n        <ellipse cx=\"144\" cy=\"130\" rx=\"14\" ry=\"12\" fill=\"#f3c9c5\"><\u002Fellipse>\n        <!-- ears -->\n        <circle cx=\"78\" cy=\"82\" r=\"11\" fill=\"#e2c79b\"><\u002Fcircle>\n        <circle cx=\"142\" cy=\"82\" r=\"11\" fill=\"#e2c79b\"><\u002Fcircle>\n        <circle cx=\"78\" cy=\"84\" r=\"5\" fill=\"#f3c9c5\"><\u002Fcircle>\n        <circle cx=\"142\" cy=\"84\" r=\"5\" fill=\"#f3c9c5\"><\u002Fcircle>\n        <!-- paws -->\n        <ellipse cx=\"92\" cy=\"158\" rx=\"9\" ry=\"7\" fill=\"#e8a89a\"><\u002Fellipse>\n        <ellipse cx=\"128\" cy=\"158\" rx=\"9\" ry=\"7\" fill=\"#e8a89a\"><\u002Fellipse>\n        <!-- nose -->\n        <path d=\"M110 118 L106 122 L114 122 Z\" fill=\"#2b2a26\"><\u002Fpath>\n        <!-- eyes -->\n        <circle class=\"eye\" cx=\"96\" cy=\"108\" r=\"3.5\" fill=\"#2b2a26\"><\u002Fcircle>\n        <circle class=\"eye-2\" cx=\"124\" cy=\"108\" r=\"3.5\" fill=\"#2b2a26\"><\u002Fcircle>\n        <!-- whiskers -->\n        <g stroke=\"#2b2a26\" stroke-width=\"1\" stroke-linecap=\"round\" opacity=\"0.5\">\n          <path d=\"M74 126 l -10 -2\"><\u002Fpath>\n          <path d=\"M74 132 l -10 2\"><\u002Fpath>\n          <path d=\"M146 126 l 10 -2\"><\u002Fpath>\n          <path d=\"M146 132 l 10 2\"><\u002Fpath>\n        <\u002Fg>\n      <\u002Fg>\n    <\u002Fsvg>\n    <div class=\"label\"><span class=\"name\">ハムスター<\u002Fspan><span class=\"num\">24<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fmain>\n\n<footer>お絵描き ・ ZOO COLLECTION ・ 2026<\u002Ffooter>\n\n<div class=\"toast\" id=\"toast\">保存しました<\u002Fdiv>\n\n<script src=\"b64a5b8e-bfa2-4c0f-9c62-ed3d450ae156\"><\u002Fscript>\n<script>\n(() => {\n  const toast = document.getElementById('toast');\n  let toastTimer;\n  const showToast = (msg) => {\n    toast.textContent = msg;\n    toast.classList.add('show');\n    clearTimeout(toastTimer);\n    toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);\n  };\n\n  const triggerDownload = (blob, filename) => {\n    const url = URL.createObjectURL(blob);\n    const a = document.createElement('a');\n    a.href = url;\n    a.download = filename;\n    document.body.appendChild(a);\n    a.click();\n    a.remove();\n    setTimeout(() => URL.revokeObjectURL(url), 1000);\n  };\n\n  // CSS used inside generated SVGs so animations render in <img> at a paused frame\n  const ANIM_CSS = `\n    @keyframes breathe { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }\n    @keyframes blink   { 0%,93%,100% { transform: scaleY(1); } 96% { transform: scaleY(0.08); } }\n    @keyframes sway    { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(6deg); } }\n    @keyframes wiggle  { 0%,100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }\n    @keyframes hop     { 0%,100% { transform: translateY(0); } 40% { transform: translateY(-4px); } 60% { transform: translateY(-3px); } }\n    @keyframes float-y { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }\n    .breathe { animation: breathe 4.5s ease-in-out infinite; transform-origin: center; }\n    .eye     { animation: blink 5.2s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }\n    .eye-2   { animation: blink 4.8s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }\n    .sway    { animation: sway 3.2s ease-in-out infinite; transform-box: fill-box; }\n    .wiggle  { animation: wiggle 2.4s ease-in-out infinite; transform-box: fill-box; }\n    .hop     { animation: hop 2.8s ease-in-out infinite; }\n    .float-y { animation: float-y 3.6s ease-in-out infinite; }\n  `;\n\n  const serializeSvg = (svg, opts = {}) => {\n    const clone = svg.cloneNode(true);\n    clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');\n    clone.setAttribute('xmlns:xlink', 'http://www.w3.org/1999/xlink');\n    const vb = (clone.getAttribute('viewBox') || '0 0 220 200').split(/\\s+/);\n    clone.setAttribute('width',  vb[2]);\n    clone.setAttribute('height', vb[3]);\n\n    if (opts.frameAt !== undefined) {\n      // Inject animation CSS + pause at a specific time so <img> renders that frame\n      const style = document.createElementNS('http://www.w3.org/2000/svg', 'style');\n      style.textContent = ANIM_CSS + `\n        .breathe, .eye, .eye-2, .sway, .wiggle, .hop, .float-y {\n          animation-play-state: paused !important;\n          animation-delay: -${opts.frameAt}s !important;\n        }\n      `;\n      clone.insertBefore(style, clone.firstChild);\n    }\n    return '<?xml version=\"1.0\" encoding=\"UTF-8\"?>\\n' + new XMLSerializer().serializeToString(clone);\n  };\n\n  const downloadSvg = (svg, name) => {\n    const data = serializeSvg(svg);\n    triggerDownload(new Blob([data], { type: 'image/svg+xml;charset=utf-8' }), `${name}.svg`);\n    showToast(`${name}.svg を保存しました`);\n  };\n\n  const downloadPng = (svg, name) => {\n    const data = serializeSvg(svg);\n    const vb = svg.getAttribute('viewBox').split(/\\s+/).map(Number);\n    const [, , vbw, vbh] = vb;\n    const targetW = 1600;\n    const canvas = document.createElement('canvas');\n    canvas.width  = targetW;\n    canvas.height = Math.round(vbh * (targetW / vbw));\n    const ctx = canvas.getContext('2d');\n    ctx.fillStyle = '#faf6ee';\n    ctx.fillRect(0, 0, canvas.width, canvas.height);\n    const img = new Image();\n    img.onload = () => {\n      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);\n      canvas.toBlob((blob) => {\n        triggerDownload(blob, `${name}.png`);\n        showToast(`${name}.png を保存しました`);\n      }, 'image/png');\n    };\n    img.onerror = () => showToast('保存に失敗しました');\n    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(data);\n  };\n\n  const loadImage = (src) => new Promise((resolve, reject) => {\n    const img = new Image();\n    img.onload = () => resolve(img);\n    img.onerror = reject;\n    img.src = src;\n  });\n\n  // Fetch gif.worker.js as a Blob URL so the Worker is loaded from the same origin\n  // (avoids \"stuck at 50%\" caused by cross-origin worker restrictions).\n  let workerBlobUrlPromise = null;\n  const getWorkerUrl = () => {\n    if (!workerBlobUrlPromise) {\n      workerBlobUrlPromise = fetch(window.__resources?.gifWorker || 'https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.worker.js')\n        .then(r => {\n          if (!r.ok) throw new Error('worker fetch failed');\n          return r.text();\n        })\n        .then(src => URL.createObjectURL(new Blob([src], { type: 'application/javascript' })));\n    }\n    return workerBlobUrlPromise;\n  };\n\n  const downloadGif = async (svg, name, btn) => {\n    if (typeof GIF === 'undefined') {\n      showToast('GIFライブラリ読み込み中…もう一度お試しください');\n      return;\n    }\n    const origLabel = btn.textContent;\n    btn.disabled = true;\n    btn.textContent = '0%';\n\n    const vb = svg.getAttribute('viewBox').split(/\\s+/).map(Number);\n    const [, , vbw, vbh] = vb;\n    const targetW = 480;\n    const W = targetW;\n    const H = Math.round(vbh * (targetW / vbw));\n\n    const duration = 2.5;     // seconds captured\n    const fps      = 12;\n    const frameCount = Math.round(duration * fps);\n    const frameDelay = Math.round(1000 / fps);\n\n    let workerUrl;\n    try {\n      workerUrl = await getWorkerUrl();\n    } catch (e) {\n      btn.disabled = false;\n      btn.textContent = origLabel;\n      showToast('GIFワーカーの読み込みに失敗しました');\n      return;\n    }\n\n    const gif = new GIF({\n      workers: 2,\n      quality: 10,\n      width: W,\n      height: H,\n      workerScript: workerUrl,\n      background: '#faf6ee'\n    });\n\n    try {\n      for (let i = 0; i < frameCount; i++) {\n        const t = i / fps;\n        const data = serializeSvg(svg, { frameAt: t });\n        const img = await loadImage('data:image/svg+xml;charset=utf-8,' + encodeURIComponent(data));\n        const c = document.createElement('canvas');\n        c.width = W; c.height = H;\n        const ctx = c.getContext('2d');\n        ctx.fillStyle = '#faf6ee';\n        ctx.fillRect(0, 0, W, H);\n        ctx.drawImage(img, 0, 0, W, H);\n        gif.addFrame(c, { copy: true, delay: frameDelay });\n        btn.textContent = Math.round(((i + 1) / frameCount) * 50) + '%';\n      }\n    } catch (e) {\n      btn.disabled = false;\n      btn.textContent = origLabel;\n      showToast('GIF生成に失敗しました');\n      return;\n    }\n\n    gif.on('progress', (p) => {\n      btn.textContent = Math.round(50 + p * 50) + '%';\n    });\n    gif.on('finished', (blob) => {\n      triggerDownload(blob, `${name}.gif`);\n      showToast(`${name}.gif を保存しました`);\n      btn.disabled = false;\n      btn.textContent = origLabel;\n    });\n    gif.on('abort', () => {\n      btn.disabled = false;\n      btn.textContent = origLabel;\n      showToast('GIF生成を中止しました');\n    });\n    gif.render();\n  };\n\n  document.querySelectorAll('.card').forEach((card) => {\n    const svg   = card.querySelector('svg');\n    const name  = card.querySelector('.label .name')?.textContent.trim() || 'animal';\n    const num   = card.querySelector('.label .num')?.textContent.trim() || '';\n    const fname = num ? `${num}_${name}` : name;\n\n    const wrap = document.createElement('div');\n    wrap.className = 'actions';\n    wrap.innerHTML = `\n      <button type=\"button\" data-fmt=\"svg\" title=\"SVGで保存\">SVG<\u002Fbutton>\n      <button type=\"button\" data-fmt=\"png\" title=\"PNGで保存\">PNG<\u002Fbutton>\n      <button type=\"button\" data-fmt=\"gif\" title=\"動くGIFで保存\">GIF<\u002Fbutton>\n    `;\n    card.appendChild(wrap);\n\n    wrap.addEventListener('click', (e) => {\n      const btn = e.target.closest('button');\n      if (!btn || btn.disabled) return;\n      const fmt = btn.dataset.fmt;\n      if (fmt === 'svg') downloadSvg(svg, fname);\n      else if (fmt === 'png') downloadPng(svg, fname);\n      else if (fmt === 'gif') downloadGif(svg, fname, btn);\n    });\n  });\n})();\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
